name: shiguangxia
description: "拾光匣 — 收藏每一件值得记住的小事"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 数据持久化
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # 数据模型
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # 图片处理
  image_picker: ^1.0.7
  flutter_image_compress: ^2.2.0

  # 工具
  uuid: ^4.3.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 代码生成
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0

  # 测试
  mocktail: ^1.0.3

  # 静态分析
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
